<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">Senior QA Engineer</title>
<desc id="desc">Вижу связи. Нахожу риски. Требования → Интеграции → Продукт.</desc>
<rect width="1000" height="405" rx="14" fill="#201b2d"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="40" y="53" fill="#bea8ed" font-size="16" font-weight="600" letter-spacing="2">SENIOR QA ENGINEER</text>
<text x="40" y="155" fill="#e6edf3" font-size="66" font-weight="600" letter-spacing="-2">Вижу связи.</text>
<text x="40" y="230" fill="#bea8ed" font-size="66" font-weight="600" letter-spacing="-2">Нахожу риски.</text>
<rect x="40" y="300" width="280" height="65" rx="9" fill="#30283e"/>
<text x="180.0" y="341" fill="#e6edf3" font-size="21" font-weight="400" text-anchor="middle">Требования</text>
<text x="340" y="342" fill="#a4adba" font-size="24" font-weight="400" text-anchor="middle">→</text>
<rect x="360" y="300" width="280" height="65" rx="9" fill="#30283e"/>
<text x="500.0" y="341" fill="#e6edf3" font-size="21" font-weight="400" text-anchor="middle">Интеграции</text>
<text x="660" y="342" fill="#a4adba" font-size="24" font-weight="400" text-anchor="middle">→</text>
<rect x="680" y="300" width="280" height="65" rx="9" fill="#30283e"/>
<text x="820.0" y="341" fill="#e6edf3" font-size="21" font-weight="400" text-anchor="middle">Продукт</text>
</g>
</svg>
