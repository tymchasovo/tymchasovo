<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="title desc">
<title id="title">Senior QA Engineer</title>
<desc id="desc">Вижу связи. Нахожу риски. Требования → Интеграции → Продукт.</desc>
<rect width="600" height="580" rx="14" fill="#201b2d"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="40" y="53" fill="#bea8ed" font-size="16" font-weight="600" letter-spacing="2">SENIOR QA ENGINEER</text>
<text x="40" y="150" fill="#e6edf3" font-size="58" font-weight="600" letter-spacing="-2">Вижу связи.</text>
<text x="40" y="215" fill="#bea8ed" font-size="58" font-weight="600" letter-spacing="-2">Нахожу риски.</text>
<rect x="40" y="280" width="520" height="62" rx="9" fill="#30283e"/>
<text x="300.0" y="321" fill="#e6edf3" font-size="21" font-weight="400" text-anchor="middle">Требования</text>
<text x="300.0" y="367" fill="#a4adba" font-size="23" font-weight="400" text-anchor="middle">↓</text>
<rect x="40" y="376" width="520" height="62" rx="9" fill="#30283e"/>
<text x="300.0" y="417" fill="#e6edf3" font-size="21" font-weight="400" text-anchor="middle">Интеграции</text>
<text x="300.0" y="463" fill="#a4adba" font-size="23" font-weight="400" text-anchor="middle">↓</text>
<rect x="40" y="472" width="520" height="62" rx="9" fill="#30283e"/>
<text x="300.0" y="513" fill="#e6edf3" font-size="21" font-weight="400" text-anchor="middle">Продукт</text>
</g>
</svg>
